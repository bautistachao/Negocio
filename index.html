<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - La Bosch</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 24px;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            margin: 14px 0;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-google { background-color: #4285F4; }
        .btn-whatsapp { background-color: #25D366; }
        .btn-instagram { background-color: #E1306C; }
        
        .btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>¡Hola! 👋</h2>
        <p>Elegí una opción para conectar con nosotros:</p>

        <!-- Botón de Reseñas de Google -->
        <a href="https://www.google.com/maps/place/ESCUELA+DE+FUTBOL+La+Bosch/@-34.5805934,-58.5872702,580m/data=!3m2!1e3!4b1!4m6!3m5!1s0x95bcb9bc74be022b:0x5b8d5598e248ce0e!8m2!3d-34.5805978!4d-58.5846953!16s%2Fg%2F11bbrn517_?entry=ttu&g_ep=EgoyMDI2MDkxMy4wIKXMDSoASAFQAw%3D%3D" class="btn btn-google" target="_blank">
            ⭐ Valórranos en Google
        </a>

        <!-- Botón de WhatsApp -->
        <a href="https://wa.me/5491127970536?text=Hola,%20vengo%20desde%20el%20cartel%20del%20local" class="btn btn-whatsapp" target="_blank">
            💬 Escribinos por WhatsApp
        </a>

        <!-- Botón de Instagram -->
        <a href="https://instagram.com/chao.bau99" class="btn btn-instagram" target="_blank">
            📸 Seguinos en Instagram
        </a>
    </div>

</body>
</html>
