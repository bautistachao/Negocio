<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto del Negocio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            display: block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 14px;
            margin: 12px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn-whatsapp { background-color: #25D366; }
        .btn-instagram { background-color: #E1306C; }
        .btn-google { background-color: #4285F4; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <h2>¡Gracias por visitarnos!</h2>
        <p>Elegí una opción para interactuar con nosotros:</p>

        <!-- Botón de Reseñas de Google -->
        <a href="https://www.google.com/maps/place/ESCUELA+DE+FUTBOL+La+Bosch/@-34.5805934,-58.5872702,580m/data=!3m2!1e3!4b1!4m6!3m5!1s0x95bcb9bc74be022b:0x5b8d5598e248ce0e!8m2!3d-34.5805978!4d-58.5846953!16s%2Fg%2F11bbrn517_?entry=ttu&g_ep=EgoyMDI2MDkxMy4wIKXMDSoASAFQAw%3D%3D" class="btn btn-google" target="_blank">⭐ Valórranos en Google</a>

        <!-- Botón de WhatsApp -->
        <a href="https://wa.me/5491127970536?text=Hola,%20vengo%20desde%20el%20cartel%20del%20local" class="btn btn-whatsapp" target="_blank">💬 Escribinos por WhatsApp</a>

        <!-- Botón de Instagram -->
        <a href="https://instagram.com/chao.bau99" class="btn btn-instagram" target="_blank">📸 Seguinos en Instagram</a>
    </div>

</body>
</html>
